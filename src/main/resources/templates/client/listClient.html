<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main/layout.html}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista klientów</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
</head>
<body>
<section layout:fragment="content">
    <table class="table table-sm caption-top" style="margin-left: 50px">
        <caption class="fs-2 font-monospace text-dark">Lista klientów</caption>
        <thead>
        <tr>
            <th scope="col">id</th>
            <th scope="col">imię i nazwisko</th>
            <th scope="col">miasto</th>
            <th scope="col">ulica i nr budynku</th>
            <th scope="col">telefon</th>
            <th scope="col">email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="client: ${clients}" th:if="${client.username}!='admin' and ${currentRestaurant==null}">
            <th scope="row" th:text="${client.id}"></th>
            <td th:text="|${client.firstName} ${client.lastName}|"></td>
            <td th:text="${client.city}"></td>
            <td th:text="${client.streetAddress}"></td>
            <td th:text="${client.phone}"></td>
            <td th:text="${client.email}"></td>
            <td sec:authorize="hasRole('ROLE_ADMIN')">
                <form th:action="|/client/delete?id=${client.id}|" method="post">
                    <input type="submit" value="Usuń">
                </form>
            </td>
        </tr>
        </tbody>
        <tbody th:if="${currentUser==null}">
        <tr th:each="client: ${restaurantClients}" th:if="${currentRestaurant!=null}">
            <th scope="row" th:text="${client.id}"></th>
            <td th:text="|${client.firstName} ${client.lastName}|"></td>
            <td th:text="${client.city}"></td>
            <td th:text="${client.streetAddress}"></td>
            <td th:text="${client.phone}"></td>
            <td th:text="${client.email}"></td>
            <td sec:authorize="hasRole('ROLE_ADMIN')">
                <form th:action="|/client/delete?id=${client.id}|" method="post">
                    <input type="submit" value="Usuń">
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
