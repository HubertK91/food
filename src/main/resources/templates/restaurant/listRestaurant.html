<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main/layout.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista restauracji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href=..\css\styles.css>
</head>
<body>
<section layout:fragment="content">
    <table class="table table-sm caption-top" style="margin-left: 50px">
        <caption class="fs-2 font-monospace text-dark">Lista restauracji</caption>
        <thead>
        <tr>
            <th scope="col">id</th>
            <th scope="col">nazwa</th>
            <th scope="col">miasto</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${currentRestaurant != null}">
            <th scope="row" th:text="${currentRestaurant.id}"></th>
            <td th:text="${currentRestaurant.name}"></td>
            <td th:text="${currentRestaurant.city}"></td>
            <td>
                <a type="submit" th:href="|../dish/menu?id=${currentRestaurant.id}|">Menu</a>
            </td>
        </tr>
        <tr th:each="restaurant: ${restaurants}" th:if="${currentRestaurant==null}">
            <th scope="row" th:text="${restaurant.id}"></th>
            <td th:text="${restaurant.name}"></td>
            <td th:text="${restaurant.city}"></td>
            <td>
                <a type="submit" th:href="|../dish/menu?id=${restaurant.id}|">Menu</a>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
