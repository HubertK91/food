<!DOCTYPE html>
<html style="position: relative; min-height: 100%" lang="en" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona główna</title>
    <style>
        * {
            margin: 0;
        }

</head>
<body style="
      padding-bottom: 100px;
      overflow-x: hidden">

</body>
</html>
