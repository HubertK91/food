<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main/layout.html}">
<head>
    <meta charset="UTF-8">
    <title>Zamówienia klientów</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Pobierz wszystkie wiersze tabeli
            const rows = document.querySelectorAll("table tr");

            rows.forEach(function(row) {
                // Sprawdź, czy wiersz ma puste komórki
                const isEmpty = Array.from(row.cells).every(cell => cell.textContent.trim() === "");

                // Jeśli wszystkie komórki są puste, ukryj wiersz
                if (isEmpty) {
                    row.style.display = "none";
                }
            });
        });
    </script>
</head>
<body>
<section layout:fragment="content">
    <table class="table table-sm caption-top" style="margin-left: 50px" th:if="${currentUser != null and currentUser.username != 'admin' and currentRestaurant == null}"
    >
        <caption class="fs-2 font-monospace text-dark">Twoje zamówienia</caption>
        <thead>
        <tr>
            <th scope="col">klient</th>
            <th scope="col">produkty</th>
            <th scope="col">restauracja</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order: ${orders}" th:unless="${#lists.isEmpty(order.dishes)} OR ${order.client.username == 'admin'}" th:if="${order.client.username == currentUser.username}">
            <th scope="row" th:text="|${order.client.firstName} ${order.client.lastName}|"></th>
            <td>

                <ul>
                    <li th:each="dish, iterStat : ${order.dishes}">
                        <span th:text="|${dish.name} ${dish.price} zł|"></span>
                        <span th:if="${iterStat.index < items.size()}" th:text="| * ${items[iterStat.index].quantity}|"></span>
                    </li>
                </ul>
            </td>
            <td>

                <ul>
                    <li th:each="dish, iterStat : ${order.dishes}">
                        <span th:text="${dish.restaurant.name}"></span>
                    </li>
                </ul>
            </td>
            <td>
                <form th:action="|/order/delete/${order.id}|" method="post">
                    <input th:if="${!order.dishes.isEmpty()}" type="submit" value="Usuń">
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <table class="table table-sm caption-top" style="margin-left: 50px" th:if="${currentUser != null and currentUser.username=='admin'}">
        <caption class="fs-2 font-monospace text-dark">Zamówienia klientów</caption>
        <thead>
        <tr>
            <th scope="col">klient</th>
            <th scope="col">produkty</th>
            <th scope="col">restauracja</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order: ${orders}" th:unless="${#lists.isEmpty(order.dishes)}">
            <th scope="row" th:text="|${order.client.firstName} ${order.client.lastName}|"></th>
            <td>

                <ul>
                    <li th:each="dish, iterStat : ${order.dishes}">
                        <span th:text="|${dish.name} ${dish.price} zł|"></span>
                        <span th:if="${iterStat.index < items.size()}" th:text="| * ${items[iterStat.index].quantity}|"></span>
                    </li>
                </ul>
            </td>
            <td>
                <ul>
                    <li th:each="dish, iterStat : ${order.dishes}">
                        <span th:text="${dish.restaurant.name}"></span>
                    </li>
                </ul>
            </td>
            <td>
                <form th:action="|/order/delete/${order.id}|" method="post">
                    <input th:if="${!order.dishes.isEmpty()}" type="submit" value="Usuń">
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <!-- Tabela dla użytkownika z rolą "Restaurant" -->
    <table class="table table-sm caption-top" style="margin-left: 50px" th:if="${currentRestaurant != null}">
        <caption class="fs-2 font-monospace text-dark">Zamówienia dla Twojej restauracji</caption>
        <thead>
        <tr>
            <th scope="col">klient</th>
            <th scope="col">produkty</th>
            <th scope="col">restauracja</th>
        </tr>
        </thead>
        <tbody>
        <!-- Pętla iterująca przez zamówienia, które mają dania z restauracji aktualnie zalogowanego użytkownika -->
        <tr th:each="order : ${orders}">
            <th th:each="dish : ${order.dishes}" th:if="${dish.restaurant.name == currentRestaurant.name}"
                th:text="|${order.client.firstName} ${order.client.lastName}|"></th>
            <td>
                <ul>
                    <li th:each="dish, iterStat : ${order.dishes}" th:if="${dish.restaurant.name == currentRestaurant.name}">
                        <span th:text="|${dish.name} ${dish.price} zł|"></span>
                        <span th:if="${iterStat.index < items.size()}" th:text="| * ${items[iterStat.index].quantity}|"></span>
                    </li>
                </ul>
            </td>
            <td>
                <ul>
                    <li th:each="dish : ${order.dishes}" th:if="${dish.restaurant.name == currentRestaurant.name}">
                        <span th:text="${dish.restaurant.name}"></span>
                    </li>
                </ul>
            </td>
            <td th:each="dish : ${order.dishes}" th:if="${dish.restaurant.name == currentRestaurant.name}">
                <form th:action="|/order/delete/${order.id}|" method="post">
                    <input type="submit" value="Usuń">
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
